[project]
name = "evopt-maps"
version = "0.1.0"
description = "Routing per veicoli elettrici con soste di ricarica su mappe OpenStreetMap"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "osmnx>=2.1",
    "networkx>=3.4",
    "numpy>=2.2",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "pytest>=8",
    "ruff>=0.8",
]
extract = [
    "osmium>=4.3.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
