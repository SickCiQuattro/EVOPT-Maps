[project]
name = "evopt-maps"
version = "0.1.0"
description = "Fastest-route planning for electric vehicles with charging stops, on OpenStreetMap data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "osmnx>=2.1",
    "networkx>=3.4",
    "numpy>=2.2",
    "fastapi>=0.146.0",
    "uvicorn>=0.54.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.14.0",
    "pytest>=8",
    "ruff>=0.8",
]
extract = [
    "osmium>=4.3.2",
]
pddl = [
    "ortools>=9.15.6755",
    "up-enhsp>=0.1.1",
    "up-fast-downward>=1.0.0",
    "up-symk>=1.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
