[project]
name = "evopt-maps"
version = "0.1.0"
description = "Routing per veicoli elettrici con soste di ricarica su mappe OpenStreetMap"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "osmnx>=2.1",
    "networkx>=3.4",
    "numpy>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
